# ─── Gradle ────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric 的仓库在部分网络环境下响应较慢，默认超时会让依赖解析中途失败
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# ─── Fabric 工具链（对应 Minecraft 26.1.2）────────────────────────────────
# 26.1 起 Minecraft 不再混淆，因此没有 mappings 一项；
# Loom 插件 id 为 net.fabricmc.fabric-loom，依赖声明也不再需要 mod 前缀。
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.18.2

# ─── Mod 元信息 ───────────────────────────────────────────────────────────
mod_version=1.0.1
maven_group=com.shiguangmeng.dynamicisland
archives_base_name=nps-minecraft

# ─── 依赖 ─────────────────────────────────────────────────────────────────
# 只声明实际用到的 Fabric API 模块，不引入聚合包 fabric-api
# （聚合包会一次拉取四十余个子模块，其中若干为 MB 级，慢速网络下极易超时）。
# 版本取自 fabric-api:0.155.3+26.1.2 的 POM。
fapi_api_base=2.0.3+ece063234c
fapi_lifecycle=4.1.1+df84eb3d4c
fapi_keymapping=2.0.4+e2bdee784c
fapi_rendering=23.3.1+e9207d814c
